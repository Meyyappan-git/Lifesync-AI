services:
  - type: web
    name: lifesync-api
    runtime: docker
    region: singapore
    plan: free
    branch: codex/light-ui-dashboard-updates
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifesync-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        fromService:
          name: lifesync-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STORAGE_DIR
        value: /app/app/storage
      - key: EMAIL_BACKEND
        value: console

  - type: web
    name: lifesync-web
    runtime: docker
    region: singapore
    plan: free
    branch: codex/light-ui-dashboard-updates
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_INTERNAL_HOSTPORT
        fromService:
          name: lifesync-api
          type: web
          property: hostport

databases:
  - name: lifesync-db
    databaseName: lifesync
    user: lifesync
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    diskSizeGB: 1
