version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lifesync-db
    environment:
      POSTGRES_USER: lifesync
      POSTGRES_PASSWORD: lifesyncpassword
      POSTGRES_DB: lifesync_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifesync -d lifesync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifesync-backend
    environment:
      POSTGRES_USER: lifesync
      POSTGRES_PASSWORD: lifesyncpassword
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: lifesync_db
      SECRET_KEY: "supersecretkey_please_change_in_production"
      FRONTEND_URL: "http://localhost:3000"
      EMAIL_BACKEND: "console"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifesync-frontend
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
